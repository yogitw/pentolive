<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Interaktif Si Pento - 2-Tak Mission</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 780px;
      background: linear-gradient(180deg, #101827 0%, #0a0f1a 100%);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px 14px 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .live-banner {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.8px;
      padding: 9px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .target-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
      user-select: none;
    }

    .target-box:hover {
      transform: scale(1.01);
      border-color: #fbbf24;
    }

    .target-title {
      font-size: 16px;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .target-sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 7px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #22c55e);
      width: 97.6%;
      transition: width 0.4s ease;
    }

    .character-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
    }

    .character-card {
      width: 240px;
      height: 240px;
      border-radius: 16px;
      border: 2px solid #334155;
      overflow: hidden;
      background: #1e293b url('bg_garasi.png') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .character-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.15s ease;
    }

    .talking-bounce {
      animation: bounceTalk 0.3s infinite alternate;
    }

    @keyframes bounceTalk {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(-5px) scale(1.025); }
    }

    .dialog-box {
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 11px 14px;
      min-height: 98px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      border-left: 5px solid #ef4444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .dialog-sender {
      font-size: 12.5px;
      font-weight: 800;
      color: #dc2626;
      line-height: 1.3;
      word-break: break-word;
    }

    .dialog-text {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.38;
      color: #0f172a;
    }

    .status-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 0 4px;
    }

    .badges {
      display: flex;
      gap: 6px;
    }

    .badge-ok { color: #22c55e; }
    .badge-warn { color: #f59e0b; }
    .badge-err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="stage">
    <div>
      <div class="live-banner">
        <span class="dot"></span>
        <span>LIVE MISI 2-TAK PENTO</span>
      </div>

      <div class="target-box" id="targetBox" title="Klik untuk ubah jumlah followers manual">
        <div class="target-title">
          🎯 Target Lapak: <span id="followerCount">586</span> / <span id="followerGoal">600</span> Followers
        </div>
        <div class="target-sub">Bantu Follow & Kasih Saran Motor 2-Tak Suhu! 👇</div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <div class="character-wrap">
      <div class="character-card">
        <img id="pentoImg" src="pento_diam.png" alt="Si Pento" />
      </div>
    </div>

    <div>
      <div class="dialog-box">
        <div class="dialog-sender" id="dialogSender">Menunggu komentar suhu 2-tak...</div>
        <div class="dialog-text" id="dialogText">
          Halo pasukan! Mending ambil bebek 2-tak dulu atau langsung nabung Ninja SS nih?
        </div>
      </div>

      <div class="status-bar">
        <div class="badges">
          <span id="aiStatus" class="badge-ok">AI: READY</span>
          <span>|</span>
          <span id="tfStatus" class="badge-warn">TF: WAIT</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. KONFIGURASI FOLLOWERS
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_FOLLOWERS = 586;
    const GOAL_FOLLOWERS = 600;

    let savedFollowers = parseInt(localStorage.getItem('pento_followers')) || 0;
    let currentFollowers = parseInt(urlParams.get('f')) ||
                           Math.max(savedFollowers, DEFAULT_FOLLOWERS);

    const followerCountEl = document.getElementById('followerCount');
    const followerGoalEl = document.getElementById('followerGoal');
    const progressBarEl = document.getElementById('progressBar');
    const targetBoxEl = document.getElementById('targetBox');

    function renderFollowers() {
      followerCountEl.textContent = currentFollowers;
      followerGoalEl.textContent = GOAL_FOLLOWERS;
      const pct = Math.min(100, Math.max(0, (currentFollowers / GOAL_FOLLOWERS) * 100));
      progressBarEl.style.width = pct + '%';
      localStorage.setItem('pento_followers', currentFollowers);
    }

    targetBoxEl.addEventListener('click', () => {
      const input = prompt('Masukkan jumlah followers @ceritapento saat ini:', currentFollowers);
      if (input !== null && !isNaN(parseInt(input))) {
        currentFollowers = parseInt(input);
        renderFollowers();
      }
    });

    renderFollowers();

    // ==========================================
    // 2. ANIMASI KARAKTER & SUARA KARTUN PENTO
    // ==========================================
    const pentoImg = document.getElementById('pentoImg');
    const dialogSender = document.getElementById('dialogSender');
    const dialogText = document.getElementById('dialogText');
    const aiStatus = document.getElementById('aiStatus');
    const tfStatus = document.getElementById('tfStatus');

    let mouthInterval = null;
    let isBusy = false;
    const commentQueue = [];

    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        const unlock = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlock);
      }
    }, { once: true });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function startTalkingAnimation() {
      pentoImg.classList.add('talking-bounce');
      let toggle = false;
      clearInterval(mouthInterval);
      mouthInterval = setInterval(() => {
        toggle = !toggle;
        pentoImg.src = toggle ? 'pento_ngomong.png' : 'pento_diam.png';
      }, 150);
    }

    function stopTalkingAnimation() {
      clearInterval(mouthInterval);
      pentoImg.classList.remove('talking-bounce');
      pentoImg.src = 'pento_diam.png';
    }

    function speakText(text, onDone) {
      if (!('speechSynthesis' in window)) {
        startTalkingAnimation();
        setTimeout(() => {
          stopTalkingAnimation();
          if (onDone) onDone();
        }, 3500);
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      utterance.rate = 1.15;
      utterance.pitch = 1.5;

      const voices = window.speechSynthesis.getVoices();
      const idVoice = voices.find(v => v.name.includes('Google Bahasa Indonesia')) ||
                      voices.find(v => v.lang.includes('id') && !v.name.toLowerCase().includes('andika')) ||
                      voices.find(v => v.lang.includes('id'));
      if (idVoice) utterance.voice = idVoice;

      utterance.onstart = () => startTalkingAnimation();
      utterance.onend = () => {
        stopTalkingAnimation();
        if (onDone) onDone();
      };
      utterance.onerror = () => {
        stopTalkingAnimation();
        if (onDone) onDone();
      };

      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 3. AI 100% GRATIS & FASIH BAHASA INDONESIA
    // ==========================================
    async function generatePentoReply(username, comment) {
      const systemInstruction = `Kamu adalah Si Pento, karakter kartun lucu yang sedang live TikTok (@ceritapento) untuk misi nabung beli motor 2-tak (seperti Kawasaki Ninja 150 SS, Yamaha F1ZR, Alfa, RX-King, atau Suzuki Tornado) dan mengejar 600 followers.
Aturan wajib:
1. Gunakan Bahasa Indonesia yang jelas, natural, dan mudah dibaca (DILARANG mengarang kata aneh atau typo).
2. Jika penonton menyebut motor 4-tak (seperti Jupiter, Supra, Beat, Vario, Mio, Vixion), sanggah dengan kocak bahwa misi Pento khusus motor 2-tak yang ngebul dan wangi oli samping.
3. Jawab langsung inti komentar penonton secara nyambung, maksimal 2 kalimat pendek (maksimal 130 karakter), tanpa emoji dan tanpa hashtag.`;

      const userMsg = `Penonton "${username}" berkomentar: "${comment}". Balas singkat dan nyambung:`;

      try {
        const res = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: systemInstruction },
              { role: 'user', content: userMsg }
            ],
            model: 'openai-large',
            seed: Math.floor(Math.random() * 100000)
          })
        });

        if (res.ok) {
          let reply = await res.text();
          reply = reply.replace(/[*#_~`"]/g, '').trim();
          if (reply && reply.length > 3 && reply.length < 240) {
            aiStatus.textContent = 'AI: FREE OK';
            aiStatus.className = 'badge-ok';
            return reply;
          }
        }
      } catch (e) {
        console.warn('Pollinations error:', e);
      }

      aiStatus.textContent = 'AI: BACKUP';
      aiStatus.className = 'badge-warn';
      return `Siap Bang ${username}, masukanmu langsung Pento catat! Bantu follow menuju 600 ya suhu biar toples 2-tak cepat penuh!`;
    }

    async function processQueue() {
      if (isBusy || commentQueue.length === 0) return;
      isBusy = true;

      const item = commentQueue.shift();
      dialogSender.textContent = `💬 ${item.user}: "${item.text}"`;
      dialogText.textContent = 'Pento lagi mikir jawaban...';

      const reply = await generatePentoReply(item.user, item.text);
      dialogText.textContent = reply;

      speakText(reply, () => {
        isBusy = false;
        processQueue();
      });
    }

    function enqueueComment(user, text) {
      if (!text || text.trim().length === 0) return;
      if (commentQueue.length >= 5) commentQueue.shift();
      commentQueue.push({ user: user || 'Suhu 2-Tak', text: text.trim() });
      processQueue();
    }

    // ==========================================
    // 4. KONEKSI WEBSOCKET TIKFINITY DESKTOP
    // ==========================================
    function connectTikFinity() {
      let ws;
      try {
        ws = new WebSocket('ws://localhost:21213/');
      } catch (e) {
        tfStatus.textContent = 'TF: ERR';
        tfStatus.className = 'badge-err';
        setTimeout(connectTikFinity, 4000);
        return;
      }

      ws.onopen = () => {
        tfStatus.textContent = 'TF: OK';
        tfStatus.className = 'badge-ok';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const ev = msg.event;
          const d = msg.data || {};

          if (ev === 'chat') {
            const uname = d.nickname || d.uniqueId || 'Suhu';
            const text = d.comment || '';
            enqueueComment(uname, text);
          } else if (ev === 'follow') {
            currentFollowers += 1;
            renderFollowers();
            const uname = d.nickname || d.uniqueId || 'Suhu';
            enqueueComment(uname, 'Baru saja mengikuti @ceritapento!');
          } else if (ev === 'gift' && d.repeatEnd) {
            const uname = d.nickname || d.uniqueId || 'Sultan';
            const giftName = d.giftName || 'Gift';
            enqueueComment(uname, `Mengirim saweran ${giftName} buat nambah isi toples 2-tak!`);
          }
        } catch (err) {}
      };

      ws.onclose = () => {
        tfStatus.textContent = 'TF: RETRY';
        tfStatus.className = 'badge-warn';
        setTimeout(connectTikFinity, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectTikFinity();
  </script>
</body>
</html>
