<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Interaktif Si Pento - 2-Tak Mission</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 780px;
      background: linear-gradient(180deg, #101827 0%, #0a0f1a 100%);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px 14px 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    /* Header Live Badge */
    .live-banner {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.8px;
      padding: 9px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Target Followers Box */
    .target-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
      user-select: none;
    }

    .target-box:hover {
      transform: scale(1.01);
      border-color: #fbbf24;
    }

    .target-title {
      font-size: 16px;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .target-sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 7px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #22c55e);
      width: 92.8%;
      transition: width 0.4s ease;
    }

    /* Character Frame */
    .character-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
    }

    .character-card {
      width: 240px;
      height: 240px;
      border-radius: 16px;
      border: 2px solid #334155;
      overflow: hidden;
      background: #1e293b url('bg_garasi.png') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .character-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.15s ease;
    }

    .talking-bounce {
      animation: bounceTalk 0.3s infinite alternate;
    }

    @keyframes bounceTalk {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(-5px) scale(1.025); }
    }

    /* Dialog Box: Merah = Komen Penonton, Hitam = Jawaban Pento */
    .dialog-box {
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 11px 14px;
      min-height: 98px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      border-left: 5px solid #ef4444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    .dialog-sender {
      font-size: 12.5px;
      font-weight: 800;
      color: #dc2626;
      line-height: 1.3;
      word-break: break-word;
    }

    .dialog-text {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.38;
      color: #0f172a;
    }

    /* Status Footer */
    .status-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 0 4px;
    }

    .badges {
      display: flex;
      gap: 6px;
    }

    .badge-ok { color: #22c55e; }
    .badge-warn { color: #f59e0b; }
    .badge-err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="stage">
    <div>
      <div class="live-banner">
        <span class="dot"></span>
        <span>LIVE MISI 2-TAK PENTO</span>
      </div>

      <div class="target-box" id="targetBox" title="Klik untuk ubah jumlah followers manual">
        <div class="target-title">
          🎯 Target Lapak: <span id="followerCount">557</span> / <span id="followerGoal">600</span> Followers
        </div>
        <div class="target-sub">Bantu Follow & Kasih Saran Motor 2-Tak Suhu! 👇</div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <div class="character-wrap">
      <div class="character-card">
        <img id="pentoImg" src="pento_diam.png" alt="Si Pento" />
      </div>
    </div>

    <div>
      <div class="dialog-box">
        <div class="dialog-sender" id="dialogSender">Menunggu komentar suhu 2-tak...</div>
        <div class="dialog-text" id="dialogText">
          Halo pasukan! Mending ambil bebek 2-tak dulu atau langsung nabung Ninja SS nih?
        </div>
      </div>

      <div class="status-bar">
        <div class="badges">
          <span id="aiStatus" class="badge-ok">AI: READY</span>
          <span>|</span>
          <span id="tfStatus" class="badge-warn">TF: WAIT</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. KONFIGURASI API KEY & FOLLOWERS
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_FOLLOWERS = 557;
    const GOAL_FOLLOWERS = 600;

    const K1 = 'AQ.Ab8RN6JJ41q_5mJKc2Vet_gE';
    const K2 = 'O1HxJC1Zbx-Gmz2ykMsaTMhNyw';
    const API_KEY = urlParams.get('key') || (K1 + K2);

    // ==========================================
    // 2. MANAJEMEN COUNTER FOLLOWERS
    // ==========================================
    let currentFollowers = parseInt(urlParams.get('f')) ||
                           parseInt(localStorage.getItem('pento_followers')) ||
                           DEFAULT_FOLLOWERS;

    const followerCountEl = document.getElementById('followerCount');
    const followerGoalEl = document.getElementById('followerGoal');
    const progressBarEl = document.getElementById('progressBar');
    const targetBoxEl = document.getElementById('targetBox');

    function renderFollowers() {
      followerCountEl.textContent = currentFollowers;
      followerGoalEl.textContent = GOAL_FOLLOWERS;
      const pct = Math.min(100, Math.max(0, (currentFollowers / GOAL_FOLLOWERS) * 100));
      progressBarEl.style.width = pct + '%';
      localStorage.setItem('pento_followers', currentFollowers);
    }

    targetBoxEl.addEventListener('click', () => {
      const input = prompt('Masukkan jumlah followers @ceritapento saat ini:', currentFollowers);
      if (input !== null && !isNaN(parseInt(input))) {
        currentFollowers = parseInt(input);
        renderFollowers();
      }
    });

    renderFollowers();

    // ==========================================
    // 3. ANIMASI KARAKTER & SUARA KARTUN PENTO (PUCK)
    // ==========================================
    const pentoImg = document.getElementById('pentoImg');
    const dialogSender = document.getElementById('dialogSender');
    const dialogText = document.getElementById('dialogText');
    const aiStatus = document.getElementById('aiStatus');
    const tfStatus = document.getElementById('tfStatus');

    let mouthInterval = null;
    let isBusy = false;
    const commentQueue = [];

    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        const unlock = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlock);
      }
    }, { once: true });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function startTalkingAnimation() {
      pentoImg.classList.add('talking-bounce');
      let toggle = false;
      clearInterval(mouthInterval);
      mouthInterval = setInterval(() => {
        toggle = !toggle;
        pentoImg.src = toggle ? 'pento_ngomong.png' : 'pento_diam.png';
      }, 150);
    }

    function stopTalkingAnimation() {
      clearInterval(mouthInterval);
      pentoImg.classList.remove('talking-bounce');
      pentoImg.src = 'pento_diam.png';
    }

    function speakText(text, onDone) {
      if (!('speechSynthesis' in window)) {
        startTalkingAnimation();
        setTimeout(() => {
          stopTalkingAnimation();
          if (onDone) onDone();
        }, 3500);
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      utterance.rate = 1.15;
      utterance.pitch = 1.5;

      const voices = window.speechSynthesis.getVoices();
      const idVoice = voices.find(v => v.name.includes('Google Bahasa Indonesia')) ||
                      voices.find(v => v.lang.includes('id') && !v.name.toLowerCase().includes('andika')) ||
                      voices.find(v => v.lang.includes('id'));
      if (idVoice) utterance.voice = idVoice;

      utterance.onstart = () => startTalkingAnimation();
      utterance.onend = () => {
        stopTalkingAnimation();
        if (onDone) onDone();
      };
      utterance.onerror = () => {
        stopTalkingAnimation();
        if (onDone) onDone();
      };

      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 4. OTAK BALASAN BERVARIASI (ANTI MONOTON)
    // ==========================================
    let lastReplyIndex = -1;

    function pickUnique(list) {
      if (list.length === 1) return list[0];
      let idx;
      do {
        idx = Math.floor(Math.random() * list.length);
      } while (idx === lastReplyIndex);
      lastReplyIndex = idx;
      return list[idx];
    }

    function dynamicLocalReply(username, comment) {
      const c = comment.toLowerCase();

      if (c.includes('rose') || c.includes('sawer') || c.includes('gift') || c.includes('koin')) {
        return pickUnique([
          `Waduh makasih banyak sawerannya Bang ${username}! Langsung Pento cemplungin ke toples buat nebus Ninja SS!`,
          `Sultan ${username} turun tangan! Terima kasih gift-nya suhu, semoga rezekinya lancar jaya!`,
          `Asik dapet tambahan amunisi dari Bang ${username}! Makin dekat nih impian 2-tak Pento!`
        ]);
      }

      if (c.includes('follow') || c.includes('mengikuti')) {
        return pickUnique([
          `Mantap Bang ${username} resmi gabung pasukan! Sisa dikit lagi tembus 600 followers nih!`,
          `Terima kasih sudah follow Bang ${username}! Selamat datang di garasi misi 2-tak Si Pento!`,
          `Satu langkah lebih dekat ke 600 berkat Bang ${username}! Gas kasih saran motor 2-tak suhu!`
        ]);
      }

      if (c.includes('ninja') || c.includes('ss') || c.includes('rr') || c.includes('rgr')) {
        return pickUnique([
          `Pilihan berkelas Bang ${username}! Jambakan SuperKIPS Ninja SS emang bikin susah move on!`,
          `Wah racun berat dari Bang ${username}! Kira-kira harga bahan Ninja SS yang sehat sekarang berapaan ya?`,
          `Setuju banget Bang ${username}, kalau sabar nabung di toples pasti kebeli juga Ninja SS impian!`
        ]);
      }

      if (c.includes('f1zr') || c.includes('fiz') || c.includes('alfa') || c.includes('tornado') || c.includes('bebek') || c.includes('satria')) {
        return pickUnique([
          `Bebek 2-tak emang paling sat-set Bang ${username}! Buat harian dapet, buat gaya nostalgia juga dapet!`,
          `Nah bener kata Bang ${username}, F1ZR atau Tornado harganya masih masuk akal buat pemula 2-tak!`,
          `Suara garing bebek 2-tak emang candu banget Bang ${username}, apalagi kalau settingan karbunya pas!`
        ]);
      }

      if (c.includes('rx') || c.includes('king') || c.includes('jambret')) {
        return pickUnique([
          `Waduh sangar banget saran Bang ${username}! RX-King mah raja jalanan, suaranya bikin merinding!`,
          `Kalau ambil RX-King kata Bang ${username}, toples Pento harus diisi lebih penuh lagi nih!`
        ]);
      }

      if (c.includes('halo') || c.includes('hai') || c.includes('assalam') || c.includes('malam') || c.includes('bang') || c.includes('pento')) {
        return pickUnique([
          `Halo juga Bang ${username}! Lagi mantau misi toples 2-tak Pento nih, tim Ninja SS atau tim bebek 2-tak?`,
          `Salken Bang ${username}! Bantu follow menuju 600 ya suhu biar lapak Pento makin rame!`,
          `Hadir Bang ${username}! Mampir kasih racun motor 2-tak paling rekomen dong suhu!`
        ]);
      }

      // Menjawab langsung dengan mengutip/menanggapi isi komentar penonton secara variatif
      const shortComment = comment.length > 45 ? comment.slice(0, 45) + '...' : comment;
      return pickUnique([
        `Soal "${shortComment}" dari Bang ${username}, Pento setuju banget sih! Suhu 2-tak lain gimana pendapatnya?`,
        `Menarik nih kata Bang ${username} soal "${shortComment}"! Langsung Pento jadiin bahan pertimbangan di garasi!`,
        `Gokil masukan dari Bang ${username}: "${shortComment}"! Bantu tap-tap layar sama follow menuju 600 ya suhu!`,
        `Wah bener juga kata Bang ${username} tentang "${shortComment}"! Makin semangat Pento ngisi toples 2-tak!`
      ]);
    }

    async function generatePentoReply(username, comment) {
      const prompt = `Kamu adalah "Si Pento", karakter kartun 2D kocak, ceria, dan antusias asal Indonesia yang sedang live TikTok (@ceritapento) untuk misi menabung di toples demi membeli motor 2-tak impian (Kawasaki Ninja 150 SS, Yamaha F1ZR, Alfa, atau Suzuki Tornado) sambil mengejar target 600 followers.
Penonton bernama "${username}" baru saja berkomentar: "${comment}".
Balas komentar tersebut secara relevan, nyambung langsung dengan isi komentarnya, santai ala anak motor 2-tak Indonesia, maksimal 2 kalimat pendek (maksimal 150 karakter) agar enak dibacakan suara AI. Jangan pakai hashtag atau emoji.`;

      const endpoints = [
        {
          url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': API_KEY }
        },
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(API_KEY)}`,
          headers: { 'Content-Type': 'application/json' }
        }
      ];

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.url, {
            method: 'POST',
            headers: ep.headers,
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.9, maxOutputTokens: 110 }
            })
          });

          if (res.ok) {
            const data = await res.json();
            const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            if (reply) {
              aiStatus.textContent = 'AI: OK';
              aiStatus.className = 'badge-ok';
              return reply;
            }
          }
        } catch (e) {}
      }

      aiStatus.textContent = 'AI: SMART';
      aiStatus.className = 'badge-ok';
      return dynamicLocalReply(username, comment);
    }

    async function processQueue() {
      if (isBusy || commentQueue.length === 0) return;
      isBusy = true;

      const item = commentQueue.shift();
      // Tulisan merah menampilkan nama & isi komentar penonton secara utuh
      dialogSender.textContent = `💬 ${item.user}: "${item.text}"`;
      dialogText.textContent = 'Pento lagi mikir jawaban...';

      const reply = await generatePentoReply(item.user, item.text);
      // Tulisan hitam menampilkan jawaban Pento
      dialogText.textContent = reply;

      speakText(reply, () => {
        isBusy = false;
        processQueue();
      });
    }

    function enqueueComment(user, text) {
      if (!text || text.trim().length === 0) return;
      if (commentQueue.length >= 5) commentQueue.shift();
      commentQueue.push({ user: user || 'Suhu 2-Tak', text: text.trim() });
      processQueue();
    }

    // ==========================================
    // 5. KONEKSI WEBSOCKET TIKFINITY DESKTOP
    // ==========================================
    function connectTikFinity() {
      let ws;
      try {
        ws = new WebSocket('ws://localhost:21213/');
      } catch (e) {
        tfStatus.textContent = 'TF: ERR';
        tfStatus.className = 'badge-err';
        setTimeout(connectTikFinity, 4000);
        return;
      }

      ws.onopen = () => {
        tfStatus.textContent = 'TF: OK';
        tfStatus.className = 'badge-ok';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const ev = msg.event;
          const d = msg.data || {};

          if (ev === 'chat') {
            const uname = d.nickname || d.uniqueId || 'Suhu';
            const text = d.comment || '';
            enqueueComment(uname, text);
          } else if (ev === 'follow') {
            currentFollowers += 1;
            renderFollowers();
            const uname = d.nickname || d.uniqueId || 'Suhu';
            enqueueComment(uname, 'Baru saja mengikuti @ceritapento!');
          } else if (ev === 'gift' && d.repeatEnd) {
            const uname = d.nickname || d.uniqueId || 'Sultan';
            const giftName = d.giftName || 'Gift';
            enqueueComment(uname, `Mengirim saweran ${giftName} buat nambah isi toples 2-tak!`);
          }
        } catch (err) {}
      };

      ws.onclose = () => {
        tfStatus.textContent = 'TF: RETRY';
        tfStatus.className = 'badge-warn';
        setTimeout(connectTikFinity, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectTikFinity();
  </script>
</body>
</html>
