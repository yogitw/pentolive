<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Interaktif Si Pento - 2-Tak Fund</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #131b26;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 28px 24px 24px;
      overflow: hidden;
    }
    .header-wrap {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .live-badge {
      background: #e6413b;
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.8px;
      padding: 14px 20px;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(230, 65, 59, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      background: #ff9a96;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.5; }
    }
    .target-box {
      background: #1a2433;
      border: 2.5px solid #f4b41a;
      border-radius: 18px;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .target-box:hover { transform: scale(1.01); }
    .target-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    .target-count {
      color: #f4b41a;
      font-size: 25px;
    }
    .target-sub {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 6px;
    }
    .avatar-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 16px 0;
    }
    .avatar-frame {
      width: 310px;
      height: 310px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #2b394d;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      background: #1f2937;
      transition: transform 0.2s ease;
    }
    .avatar-frame.speaking {
      transform: scale(1.04);
      border-color: #f4b41a;
    }
    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .chat-card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      color: #111827;
      border-radius: 20px;
      padding: 20px 24px;
      min-height: 135px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .chat-user {
      font-size: 16px;
      font-weight: 800;
      color: #dc2626;
    }
    .chat-reply {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      color: #1f2937;
    }
    .status-bar {
      width: 100%;
      max-width: 620px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
    }
    .status-ok { color: #22c55e; }
  </style>
</head>
<body>

  <div class="header-wrap">
    <div class="live-badge">
      <span class="dot"></span>
      <span>LIVE MISI 2-TAK PENTO</span>
    </div>

    <div class="target-box" id="targetBox" title="Klik untuk edit manual angka followers">
      <div class="target-title">
        🎯 Target Lapak: <span class="target-count"><span id="followerCount">533</span> / 600 Followers</span>
      </div>
      <div class="target-sub">Bantu Follow &amp; Kasih Saran Motor 2-Tak Suhu! 👇</div>
    </div>
  </div>

  <div class="avatar-stage">
    <div class="avatar-frame" id="avatarFrame">
      <img id="pentoImg" src="pento_diam.png" alt="Si Pento" onerror="this.src='https://via.placeholder.com/310?text=Pento'" />
    </div>
  </div>

  <div class="chat-card">
    <div class="chat-user" id="chatUser">Menunggu komentar suhu 2-tak...</div>
    <div class="chat-reply" id="chatReply">Halo pasukan! Mending ambil bebek 2-tak dulu atau langsung nabung Ninja SS nih?</div>
  </div>

  <div class="status-bar">
    <span id="aiStatus">AI: CHECK</span> | <span id="tfStatus">TF: WAIT</span>
  </div>

  <script>
    // === KONFIGURASI UTAMA ===
    const DEFAULT_FOLLOWERS = 533;
    const TARGET_FOLLOWERS = 600;
    const urlParams = new URLSearchParams(window.location.search);
    const API_KEY = urlParams.get('key') || 'AQ.Ab8RN6Jg-NBcLT9FnWF_4xmPysqOGdL2deEP0mVr1FL5hJaJIQ';

    // === SISTEM AUTO FOLLOWER COUNTER ===
    const followerEl = document.getElementById('followerCount');
    const STORAGE_KEY = 'pento_followers_count';

    function loadFollowers() {
      const paramF = parseInt(urlParams.get('f'), 10);
      const savedF = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      let current = DEFAULT_FOLLOWERS;
      if (!isNaN(paramF) && paramF > 0) {
        current = paramF;
      } else if (!isNaN(savedF) && savedF >= DEFAULT_FOLLOWERS) {
        current = savedF;
      }
      localStorage.setItem(STORAGE_KEY, current);
      followerEl.textContent = current;
      return current;
    }

    let currentFollowers = loadFollowers();

    function addFollower(username) {
      currentFollowers += 1;
      localStorage.setItem(STORAGE_KEY, currentFollowers);
      followerEl.textContent = currentFollowers;
      const sisa = Math.max(0, TARGET_FOLLOWERS - currentFollowers);
      const msg = sisa > 0
        ? `Wih makasih suhu ${username} udah follow! Sekarang ${currentFollowers}/600, tinggal ${sisa} lagi buka keranjang kuning!`
        : `GOKIL! Tembus ${currentFollowers} followers! Makasih banyak suhu ${username}!`;
      updateChat(`🎉 ${username} baru saja Follow!`, msg);
      speakText(msg);
    }

    // Klik kotak target jika ingin ubah angka manual sewaktu-waktu
    document.getElementById('targetBox').addEventListener('click', () => {
      const input = prompt('Masukkan jumlah followers terbaru:', currentFollowers);
      const parsed = parseInt(input, 10);
      if (!isNaN(parsed) && parsed >= 0) {
        currentFollowers = parsed;
        localStorage.setItem(STORAGE_KEY, currentFollowers);
        followerEl.textContent = currentFollowers;
      }
    });

    // === TAMPILAN & SUARA PENTO ===
    const chatUserEl = document.getElementById('chatUser');
    const chatReplyEl = document.getElementById('chatReply');
    const pentoImgEl = document.getElementById('pentoImg');
    const avatarFrameEl = document.getElementById('avatarFrame');
    const aiStatusEl = document.getElementById('aiStatus');
    const tfStatusEl = document.getElementById('tfStatus');

    let isBusy = false;
    const commentQueue = [];

    function updateChat(user, text) {
      chatUserEl.textContent = user;
      chatReplyEl.textContent = text;
    }

    function setSpeaking(state) {
      if (state) {
        pentoImgEl.src = 'pento_ngomong.png';
        avatarFrameEl.classList.add('speaking');
      } else {
        pentoImgEl.src = 'pento_diam.png';
        avatarFrameEl.classList.remove('speaking');
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.rate = 1.08;
      utter.pitch = 1.05;
      utter.onstart = () => setSpeaking(true);
      utter.onend = () => {
        setSpeaking(false);
        isBusy = false;
        processNextQueue();
      };
      utter.onerror = () => {
        setSpeaking(false);
        isBusy = false;
        processNextQueue();
      };
      window.speechSynthesis.speak(utter);
    }

    // === GEMINI AI RESPONDER ===
    async function askGemini(username, comment) {
      if (!API_KEY) {
        aiStatusEl.textContent = 'AI: NO KEY';
        return `Mantap masukannya suhu ${username}!`;
      }
      try {
        const promptText = `Kamu adalah Pento, karakter kartun cowok santai yang lagi nabung di toples buat beli motor 2-tak impian (Kawasaki Ninja 150 SS atau bebek 2-tak seperti F1ZR / Satria 2-tak). Balas komentar penonton live TikTok bernama "${username}" yang bilang: "${comment}". Jawab singkat maksimal 2 kalimat, bahasa gaul Indonesia santai, jenaka, dan memancing penonton lain ikut komen.`;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if (reply) {
          aiStatusEl.textContent = 'AI: OK';
          aiStatusEl.classList.add('status-ok');
          return reply;
        }
      } catch (e) {
        console.error(e);
      }
      return `Siap suhu ${username}, racun 2-taknya langsung Pento catat ke toples tabungan!`;
    }

    async function processNextQueue() {
      if (isBusy || commentQueue.length === 0) return;
      isBusy = true;
      const item = commentQueue.shift();

      if (item.type === 'follow') {
        addFollower(item.username);
        return;
      }

      updateChat(`💬 @${item.username}: "${item.comment}"`, 'Pento lagi mikir...');
      const reply = await askGemini(item.username, item.comment);
      updateChat(`💬 @${item.username}: "${item.comment}"`, reply);
      speakText(reply);
    }

    // === KONEKSI WEBSOCKET TIKFINITY (PORT 21213) ===
    function connectTikFinity() {
      const ws = new WebSocket('ws://localhost:21213/');

      ws.onopen = () => {
        tfStatusEl.textContent = 'TF: OK';
        tfStatusEl.classList.add('status-ok');
        aiStatusEl.textContent = 'AI: OK';
        aiStatusEl.classList.add('status-ok');
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const evType = (msg.event || '').toLowerCase();
          const data = msg.data || {};
          const user = data.nickname || data.uniqueId || 'Suhu 2-Tak';

          // Deteksi Follow Baru Otomatis
          if (evType === 'follow' || (evType === 'social' && (data.displayType || '').includes('follow'))) {
            commentQueue.unshift({ type: 'follow', username: user });
            processNextQueue();
          }
          // Deteksi Komentar Penonton
          else if (evType === 'chat' && data.comment) {
            if (commentQueue.length < 5) {
              commentQueue.push({ type: 'chat', username: user, comment: data.comment });
              processNextQueue();
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      ws.onclose = () => {
        tfStatusEl.textContent = 'TF: RETRY';
        tfStatusEl.classList.remove('status-ok');
        setTimeout(connectTikFinity, 3000);
      };
    }

    connectTikFinity();
  </script>
</body>
</html>
